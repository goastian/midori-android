name: Update Midori New Tab

on:
  schedule:
    - cron: "23 8 * * *"
  workflow_dispatch: {}
  repository_dispatch:
    types: [midori-tab-updated]

permissions:
  contents: read

concurrency:
  group: update-midori-tab
  cancel-in-progress: false

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      commit: ${{ steps.metadata.outputs.commit }}
      short: ${{ steps.metadata.outputs.short }}
      tag: ${{ steps.metadata.outputs.tag }}
    steps:
      - name: Check out Midori Android without credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.17.1

      - name: Build and validate the upstream Firefox bundle
        env:
          # This value is embedded in the APK. Configure it as a public,
          # origin-restricted Unsplash client key, never as a privileged secret.
          VITE_UNSPLASH_API: ${{ vars.MIDORI_TAB_UNSPLASH_API }}
          VITE_MARKETPLACE_API_BASE_URL: https://marketplace.astian.org
          VITE_PASSPORT_SERVER: https://accounts.astian.org
          VITE_PASSPORT_DOMAIN_SERVER: https://vpn.astian.org
          VITE_ADS_API_BASE: https://ads.astian.org
          VITE_ADS_NEWTAB_PATH: /api/v1/ads/newtab
        run: ./scripts/sync-midori-tab.sh

      - name: Verify the Play Store release variant
        run: ./gradlew --no-daemon :app:verifyMidoriNewTabBundle :app:testOriginalPlaystoreReleaseUnitTest :app:mergeOriginalPlaystoreReleaseAssets

      - name: Verify Midori Tab is merged into Play Store release assets
        run: |
          source_dir="app/src/main/assets/extensions/midori_newtab"
          merged_dir="app/build/intermediates/assets/originalPlaystoreRelease/mergeOriginalPlaystoreReleaseAssets/extensions/midori_newtab"
          test -f "$merged_dir/manifest.json"
          test -f "$merged_dir/upstream.json"
          cmp "$source_dir/manifest.json" "$merged_dir/manifest.json"
          cmp "$source_dir/upstream.json" "$merged_dir/upstream.json"

      - name: Read synchronized metadata
        id: metadata
        run: |
          node -e '
            const fs = require("fs");
            const metadata = JSON.parse(fs.readFileSync("app/src/main/assets/extensions/midori_newtab/upstream.json", "utf8"));
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${metadata.sourceVersion}\ntag=${metadata.release.tag}\ncommit=${metadata.sourceCommit}\nshort=${metadata.sourceCommit.slice(0, 12)}\n`);
          '

      - name: Upload the verified bundle only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: midori-newtab-${{ steps.metadata.outputs.commit }}
          path: app/src/main/assets/extensions/midori_newtab
          if-no-files-found: error
          retention-days: 3

  open-update-pr:
    needs: build-and-verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out a fresh trusted tree
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download the verified bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: midori-newtab-${{ needs.build-and-verify.outputs.commit }}
          path: ${{ runner.temp }}/midori-newtab

      - name: Enforce monotonic update against the trusted tree
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/midori-newtab
        run: |
          current="app/src/main/assets/extensions/midori_newtab/upstream.json"
          candidate="$ARTIFACT_DIR/upstream.json"
          test -f "$candidate"
          if [ -f "$current" ]; then
            node scripts/verify-midori-tab-update.mjs "$current" "$candidate"
          fi

      - name: Import only regular bundle files
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/midori-newtab
        run: |
          unexpected_entry="$(find "$ARTIFACT_DIR" -mindepth 1 ! -type f ! -type d -print -quit)"
          if [ -n "$unexpected_entry" ]; then
            echo "Refusing non-regular artifact entry: $unexpected_entry" >&2
            exit 1
          fi
          test -f "$ARTIFACT_DIR/manifest.json"
          test -f "$ARTIFACT_DIR/upstream.json"
          target="app/src/main/assets/extensions/midori_newtab"
          rm -rf "$target"
          mkdir -p "$target"
          cp -a "$ARTIFACT_DIR/." "$target/"

      - name: Re-verify the Play Store release variant without executing upstream code
        run: ./gradlew --no-daemon :app:verifyMidoriNewTabBundle :app:testOriginalPlaystoreReleaseUnitTest :app:mergeOriginalPlaystoreReleaseAssets

      - name: Verify imported Play Store release assets and latest release again
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          source_dir="app/src/main/assets/extensions/midori_newtab"
          merged_dir="app/build/intermediates/assets/originalPlaystoreRelease/mergeOriginalPlaystoreReleaseAssets/extensions/midori_newtab"
          cmp "$source_dir/manifest.json" "$merged_dir/manifest.json"
          cmp "$source_dir/upstream.json" "$merged_dir/upstream.json"
          node scripts/verify-midori-tab-latest-release.mjs "$source_dir/upstream.json"

      - name: Open or refresh the update pull request
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build-and-verify.outputs.version }}
          RELEASE_TAG: ${{ needs.build-and-verify.outputs.tag }}
          SOURCE_COMMIT: ${{ needs.build-and-verify.outputs.commit }}
          SHORT_COMMIT: ${{ needs.build-and-verify.outputs.short }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          target="app/src/main/assets/extensions/midori_newtab"
          if [ -z "$(git status --porcelain -- "$target")" ]; then
            echo "Midori New Tab is already current."
            exit 0
          fi

          branch="automation/midori-tab-${SHORT_COMMIT}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          gh auth setup-git
          git switch -C "$branch" "origin/$DEFAULT_BRANCH"
          git add "$target"
          git commit -m "Update Midori New Tab to ${VERSION}"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            git fetch origin "refs/heads/$branch:refs/remotes/origin/$branch"
          fi
          git push --force-with-lease origin "HEAD:${branch}"

          body="Synchronizes the latest stable goastian/midori-tab release ${RELEASE_TAG} at commit ${SOURCE_COMMIT}. The official Firefox asset digest was verified, the tagged source ran in a credential-free build job, and the Android asset contract plus originalPlaystoreRelease unit tests passed again before this PR was created. This PR is intentionally not auto-merged."
          existing_pr="$(gh pr list --state open --head "$branch" --json number --jq '.[0].number // empty')"
          if [ -n "$existing_pr" ]; then
            gh pr edit "$existing_pr" --title "Update Midori New Tab to ${VERSION}" --body "$body"
          else
            gh pr create \
              --base "$DEFAULT_BRANCH" \
              --head "$branch" \
              --title "Update Midori New Tab to ${VERSION}" \
              --body "$body"
          fi
