[package]
name = "midori-sync-android"
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"
publish = false

[lib]
name = "midori_sync_android"
crate-type = ["cdylib", "rlib"]

[dependencies]
midori_sync_core = { path = "core" }
jni = "=0.21.1"
zeroize = "=1.8.2"

[profile.release]
lto = "thin"
strip = "debuginfo"
