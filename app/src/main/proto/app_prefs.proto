syntax = "proto3";

option java_package = "org.midorinext.android.preferences.app";
option java_multiple_files = true;

enum ToolbarPosition {
  TOP = 0;
  BOTTOM = 1;
}

enum TabsViewOption {
  GRID = 0;
  LIST = 1;
}

enum ToolbarShortcut {
  TOOLBAR_SHORTCUT_NONE = 0;
  TOOLBAR_SHORTCUT_NEW_TAB = 1;
  TOOLBAR_SHORTCUT_SHARE = 2;
  TOOLBAR_SHORTCUT_BOOKMARK = 3;
  TOOLBAR_SHORTCUT_HOMEPAGE = 4;
  TOOLBAR_SHORTCUT_BACK = 5;
  TOOLBAR_SHORTCUT_SUMMARIZE = 6;
}

enum DownloadRemovalBehavior {
  DOWNLOAD_REMOVAL_ASK = 0;
  DOWNLOAD_REMOVAL_DELETE_FROM_DEVICE = 1;
  DOWNLOAD_REMOVAL_REMOVE_FROM_HISTORY = 2;
}

enum Appearance {
  SYSTEM_SETTINGS = 0;
  LIGHT = 1;
  DARK = 2;
}

enum TrackingProtectionLevel {
  STANDARD = 0;
  STRICT = 1;
  CUSTOM = 2;
}

enum DoHProvider {
  DOH_DEFAULT = 0;
  DOH_INCREASED_PROTECTION = 1;
  DOH_MAX_PROTECTION = 2;
  DOH_OFF = 3;
}

enum HttpsOnlyLevel {
  OFF = 0;
  ALL_TABS = 1;
  PRIVATE_TABS = 2;
}

enum AppTrackingProtectionMode {
  BROWSER_FIRST = 0;
  HYBRID_SYSTEM = 1;
}

enum HomepageOpeningScreen {
  HOMEPAGE = 0;
  LAST_TAB = 1;
  HOMEPAGE_AFTER_FOUR_HOURS = 2;
}

message AppPreferences {
  bool hide_toolbar_on_scroll = 1;
  ToolbarPosition toolbar_position = 2;
  TabsViewOption tabs_view = 3;
  bool open_links_in_app = 4;
  bool clear_data_on_quit = 5;
  bool clear_data_history = 6;
  bool clear_data_tabs = 7;
  int32 clear_data_browsingdata = 8;
  reserved 9;
  Appearance appearance = 10;
  bool privacy_global_privacy_control = 11;
  bool privacy_fingerprinting_protection = 12;
  bool privacy_cookie_partitioning = 13;
  bool privacy_strict_tracking_protection = 14;
  TrackingProtectionLevel tracking_protection_level = 15;
  DoHProvider doh_provider = 16;
  HttpsOnlyLevel https_only_level = 17;
  AppTrackingProtectionMode app_tracking_protection_mode = 18;
  bool app_tracking_system_enabled = 19;
  repeated string app_tracking_excluded_packages = 20;
  bool download_wifi_only = 21;
  bool open_blank_new_tab = 22;
  reserved 23, 24, 25, 26;
  reserved "homepage_shortcuts_enabled", "homepage_privacy_stats_enabled",
    "homepage_weather_enabled", "homepage_background_photo_enabled";
  bool pull_to_refresh_enabled = 27;
  bool save_passwords_enabled = 28;
  bool password_autofill_enabled = 29;
  reserved 30;
  bool autofill_addresses_enabled = 31;
  bool autofill_cards_enabled = 32;
  bool accessibility_automatic_font_sizing = 33;
  int32 accessibility_font_scale = 34;
  bool accessibility_force_zoom_enabled = 35;
  HomepageOpeningScreen homepage_opening_screen = 36;
  ToolbarShortcut toolbar_shortcut = 37;
  bool swipe_address_bar_to_switch_tabs_enabled = 38;
  bool swipe_toolbar_to_show_tabs_enabled = 39;
  bool shake_to_summarize_enabled = 40;
  DownloadRemovalBehavior download_removal_behavior = 41;
  bool manage_downloads_with_other_app = 42;
}
