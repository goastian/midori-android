tasks.register("verifyLocalizedStrings") {
    group = "verification"
    description = "Checks that every locale declared by locale-config.xml defines every app string."

    doLast {
        def resourcesDirectory = file("src/main/res")
        def stringNamesIn = { File directory ->
            fileTree(directory) {
                include "strings*.xml"
            }.collectMany { resourceFile ->
                new XmlSlurper(false, false)
                    .parse(resourceFile)
                    .children()
                    .findAll { it.@name.text() }
                    .collect { it.@name.text() }
            } as Set
        }

        def baseNames = stringNamesIn(resourcesDirectory.toPath().resolve("values").toFile())
        def localeConfig = new XmlSlurper(false, false).parse(file("src/main/res/xml/locales_config.xml"))
        def missingByLocale = localeConfig.locale.collectEntries { locale ->
            def languageTag = locale.attributes().find { key, value -> key.toString().endsWith("name") }?.value?.toString()
            if (languageTag == "en") {
                return [(languageTag): [] as Set]
            }
            def qualifierParts = []
            languageTag.split("-").eachWithIndex { part, index ->
                qualifierParts << (index == 0 ? part : "r${part}")
            }
            def qualifier = qualifierParts.join("-")
            def localeNames = stringNamesIn(resourcesDirectory.toPath().resolve("values-${qualifier}").toFile())
            [(languageTag): baseNames - localeNames]
        }.findAll { _, missing -> !missing.isEmpty() }

        if (!missingByLocale.isEmpty()) {
            def details = missingByLocale.collect { locale, missing ->
                "${locale}: ${missing.size()} missing (${missing.sort().join(', ')})"
            }.join("\n")
            throw new GradleException("Localized strings are out of sync:\n${details}")
        }
    }
}

tasks.named("check").configure {
    dependsOn(tasks.named("verifyLocalizedStrings"))
}

def midoriNewTabAssets = file("src/main/assets/extensions/midori_newtab")
def midoriPrivacyAssets = file("src/main/assets/extensions/midori_privacy")

def isMidoriAddonMetadataValid = { metadata, manifest, addon, repository, compatibilityRevision ->
    def sourceVersion = metadata.sourceVersion?.toString()
    def tag = "v${sourceVersion}"
    def assetName = "${addon}-${sourceVersion}-firefox.zip"
    def release = metadata.release
    def asset = release?.firefoxAsset

    metadata.keySet().toSet() == [
            "sourceRepository", "sourceVersion", "version",
            "compatibilityRevision", "bundleSha256", "release",
    ].toSet() &&
            release instanceof Map &&
            release.keySet().toSet() == ["tag", "url", "firefoxAsset"].toSet() &&
            asset instanceof Map &&
            asset.keySet().toSet() == ["name", "url", "sha256"].toSet() &&
            metadata.sourceRepository == repository &&
            sourceVersion ==~ /[0-9]+\.[0-9]+\.[0-9]+/ &&
            metadata.compatibilityRevision == compatibilityRevision &&
            metadata.version == "${sourceVersion}.${compatibilityRevision}" &&
            metadata.version == manifest.version &&
            metadata.bundleSha256 ==~ /[0-9a-f]{64}/ &&
            release.tag == tag &&
            release.url == "${repository}/releases/tag/${tag}" &&
            asset.name == assetName &&
            asset.url == "${repository}/releases/download/${tag}/${assetName}" &&
            asset.sha256 ==~ /[0-9a-f]{64}/
}

tasks.register("verifyMidoriNewTabBundle") {
    group = "verification"
    description = "Verifies the bundled goastian/midori-tab Firefox artifact."
    inputs.dir(midoriNewTabAssets)

    doLast {
        def manifestFile = new File(midoriNewTabAssets, "manifest.json")
        def metadataFile = new File(midoriNewTabAssets, "upstream.json")
        def requiredFiles = [
                manifestFile,
                metadataFile,
                new File(midoriNewTabAssets, "index.html"),
                new File(midoriNewTabAssets, "index.js"),
                new File(midoriNewTabAssets, "background.js"),
                new File(midoriNewTabAssets, "LICENSE.upstream"),
        ]
        def missing = requiredFiles.findAll { !it.isFile() }
        if (!missing.isEmpty()) {
            throw new GradleException("Midori New Tab bundle is incomplete: ${missing*.name.join(', ')}")
        }

        def manifest = new JsonSlurper().parse(manifestFile)
        def metadata = new JsonSlurper().parse(metadataFile)
        def expectedPermissions = [
                "storage", "tabs", "activeTab", "browsingData", "https://api.rss2json.com/*",
                "https://api.unsplash.com/*", "https://api.github.com/*",
                "https://api.open-meteo.com/*", "https://geocoding-api.open-meteo.com/*",
                "https://ipwho.is/*", "https://nominatim.openstreetmap.org/*",
                "https://duckduckgo.com/*", "https://astiango.com/*",
                "https://marketplace.astian.org/*", "https://open.er-api.com/*",
                "https://ads.astian.org/*",
        ]
        if (manifest.manifest_version != 2 ||
                manifest.browser_specific_settings?.gecko?.id != "midoritabs@astian.org" ||
                manifest.containsKey("chrome_url_overrides") ||
                manifest.containsKey("commands") ||
                manifest.permissions != expectedPermissions) {
            throw new GradleException("Midori New Tab has an incompatible Firefox manifest")
        }
        def bundledJavascript = fileTree(midoriNewTabAssets)
                .matching { include("**/*.js") }
                .files
                .collect { bundledFile -> bundledFile.getText("UTF-8") }
                .join("\n")
        def backgroundScript = new File(midoriNewTabAssets, "background.js").getText("UTF-8")
        def privacyContractMarkers = [
                "midori-protection@astian.org",
                "get-stats-summary",
        ]
        if (privacyContractMarkers.any { marker -> !bundledJavascript.contains(marker) } ||
                !backgroundScript.contains("ANDROID_UNSUPPORTED_ACTIONS") ||
                !backgroundScript.contains("chrome.windows?.onFocusChanged?.addListener") ||
                !backgroundScript.contains("chrome.commands?.onCommand?.addListener")) {
            throw new GradleException("Midori New Tab does not contain the Android Midori Privacy widget contract")
        }
        if (!isMidoriAddonMetadataValid(
                metadata,
                manifest,
                "midori-tab",
                "https://github.com/goastian/midori-tab",
                6,
        )) {
            throw new GradleException("Midori New Tab upstream metadata does not match its bundle")
        }

        def bundlePath = midoriNewTabAssets.toPath()
        def entries = java.nio.file.Files.walk(bundlePath)
        try {
            def unexpectedEntry = entries
                    .filter { path -> path != bundlePath }
                    .filter { path ->
                        !java.nio.file.Files.isDirectory(path, java.nio.file.LinkOption.NOFOLLOW_LINKS) &&
                                !java.nio.file.Files.isRegularFile(path, java.nio.file.LinkOption.NOFOLLOW_LINKS)
                    }
                    .findFirst()
            if (unexpectedEntry.isPresent()) {
                throw new GradleException("Midori New Tab contains a non-regular entry: ${unexpectedEntry.get()}")
            }
        } finally {
            entries.close()
        }

        def sha256 = { byte[] content ->
            java.security.MessageDigest.getInstance("SHA-256")
                    .digest(content)
                    .encodeHex()
                    .toString()
        }
        def bundleRecords = fileTree(midoriNewTabAssets)
                .matching { exclude("upstream.json") }
                .files
                .sort { first, second ->
                    midoriNewTabAssets.toPath().relativize(first.toPath()).toString() <=>
                            midoriNewTabAssets.toPath().relativize(second.toPath()).toString()
                }
                .collect { bundledFile ->
                    def relativePath = midoriNewTabAssets.toPath()
                            .relativize(bundledFile.toPath())
                            .toString()
                            .replace('\\', '/')
                    "${sha256(bundledFile.bytes)}  ./${relativePath}\n"
                }
                .join("")
        def actualBundleSha256 = sha256(bundleRecords.getBytes(java.nio.charset.StandardCharsets.UTF_8))
        if (actualBundleSha256 != metadata.bundleSha256) {
            throw new GradleException("Midori New Tab bundle checksum does not match upstream.json")
        }
    }
}

tasks.register("verifyMidoriPrivacyBundle") {
    group = "verification"
    description = "Verifies the bundled goastian/midori-privacy Firefox artifact."
    inputs.dir(midoriPrivacyAssets)

    doLast {
        def manifestFile = new File(midoriPrivacyAssets, "manifest.json")
        def metadataFile = new File(midoriPrivacyAssets, "upstream.json")
        def backgroundPageFile = new File(midoriPrivacyAssets, "background.html")
        def backgroundScriptFile = new File(midoriPrivacyAssets, "js/background.js")
        def assetsScriptFile = new File(midoriPrivacyAssets, "js/assets.js")
        def vapiCommonScriptFile = new File(midoriPrivacyAssets, "js/vapi-common.js")
        def startFile = new File(midoriPrivacyAssets, "js/start.js")
        def storageScriptFile = new File(midoriPrivacyAssets, "js/storage.js")
        def statsBridgeFile = new File(midoriPrivacyAssets, "js/midori-stats.js")
        def requiredFiles = [
                manifestFile,
                metadataFile,
                backgroundPageFile,
                backgroundScriptFile,
                assetsScriptFile,
                vapiCommonScriptFile,
                startFile,
                storageScriptFile,
                statsBridgeFile,
                new File(midoriPrivacyAssets, "popup-fenix.html"),
                new File(midoriPrivacyAssets, "css/popup-fenix.css"),
                new File(midoriPrivacyAssets, "js/popup-fenix.js"),
                new File(midoriPrivacyAssets, "js/vapi.js"),
                new File(midoriPrivacyAssets, "js/traffic.js"),
                new File(midoriPrivacyAssets, "assets/assets.json"),
                new File(midoriPrivacyAssets, "assets/ublock/filters.min.txt"),
                new File(midoriPrivacyAssets, "LICENSE.upstream"),
        ]
        def missing = requiredFiles.findAll { !it.isFile() }
        if (!missing.isEmpty()) {
            throw new GradleException("Midori Privacy bundle is incomplete: ${missing*.name.join(', ')}")
        }

        def manifest = new JsonSlurper().parse(manifestFile)
        def metadata = new JsonSlurper().parse(metadataFile)
        def expectedPermissions = [
                "alarms", "dns", "privacy", "storage", "tabs", "unlimitedStorage",
                "webNavigation", "webRequest", "webRequestBlocking", "<all_urls>",
        ]
        def permissions = manifest.permissions instanceof List ? manifest.permissions : []
        def parseMajorVersion = { value ->
            def matcher = (value?.toString() ?: "") =~ /^([0-9]+)(?:\.[0-9]+)*$/
            matcher.matches() ? Integer.parseInt(matcher.group(1)) : -1
        }
        def gecko = manifest.browser_specific_settings?.gecko
        def geckoAndroid = manifest.browser_specific_settings?.gecko_android
        if (manifest.manifest_version != 2 ||
                manifest.browser_action?.default_popup != "popup-fenix.html" ||
                manifest.background?.page != "background.html" ||
                gecko?.id != "midori-protection@astian.org" ||
                parseMajorVersion(gecko?.strict_min_version) < 115 ||
                parseMajorVersion(geckoAndroid?.strict_min_version) < 115 ||
                gecko?.data_collection_permissions?.required != ["none"] ||
                !(manifest.version ==~ /[0-9]+\.[0-9]+\.[0-9]+\.5/) ||
                permissions.size() != expectedPermissions.size() ||
                permissions.toSet() != expectedPermissions.toSet()) {
            throw new GradleException("Midori Privacy has an incompatible Firefox Android manifest")
        }

        def backgroundPage = backgroundPageFile.getText("UTF-8")
        def backgroundScript = backgroundScriptFile.getText("UTF-8")
        def assetsScript = assetsScriptFile.getText("UTF-8")
        def vapiCommonScript = vapiCommonScriptFile.getText("UTF-8")
        def startScript = startFile.getText("UTF-8")
        def storageScript = storageScriptFile.getText("UTF-8")
        def statsBridge = statsBridgeFile.getText("UTF-8")
        def hasExactSenderAllowlist = (statsBridge =~ /(?s)const ALLOWED_SENDER_IDS = new Set\(\[\s*'midoritabs@astian\.org',?\s*\]\);/).find()
        def hasEstimatedCalculation = (statsBridge =~ /(?s)Math\.min\(\s*Number\.MAX_SAFE_INTEGER,\s*blocked \* ESTIMATED_BYTES_PER_BLOCK\s*\)/).find()
        if (!backgroundPage.contains('src="js/start.js"') ||
                !startScript.contains("import './midori-stats.js';")) {
            throw new GradleException("Midori Privacy does not load its statistics bridge")
        }
        if (!backgroundScript.contains("assetsJsonPath: 'assets/assets.json'") ||
                backgroundScript.contains("assets/assets.dev.json") ||
                !vapiCommonScript.contains("const isAndroidCompatibilityBuild =") ||
                !vapiCommonScript.contains("isAndroidCompatibilityBuild === false") ||
                !assetsScript.contains("function assetSourceRegistryIsValid(registry)") ||
                !assetsScript.contains("registry['assets.json'] instanceof Object === false") ||
                !assetsScript.contains("assetKey !== 'user-filters'") ||
                !assetsScript.contains("entry.submitter !== 'user'") ||
                !assetsScript.contains("if ( assetSourceRegistryIsValid(cachedRegistry) )") ||
                !assetsScript.contains("if ( assetSourceRegistryIsValid(newDict) === false ) { return; }") ||
                !assetsScript.contains("assets.fetch = function(url, options = {})") ||
                assetsScript.contains("Midori Privacy could not fetch packaged asset") ||
                !storageScript.contains("midoriAndroidFilterListsMigration") ||
                !storageScript.contains("hasBrokenAndroidBootstrapState") ||
                !storageScript.contains("availableListKeys.every(key => key === this.userFiltersPath)") ||
                !storageScript.contains("this.selfieManager.destroy();")) {
            throw new GradleException("Midori Privacy Android filter-list bootstrap repair is incomplete")
        }
        if (!statsBridge.contains("const STATS_ACTION = 'get-stats-summary';") ||
                !hasExactSenderAllowlist ||
                !statsBridge.contains("ALLOWED_SENDER_IDS.has(sender.id) === false") ||
                !statsBridge.contains("request.action !== STATS_ACTION") ||
                !statsBridge.contains("sendResponse(getStatsSummary(sender));") ||
                !statsBridge.contains("browser.runtime.onMessageExternal.addListener(onExternalMessage);") ||
                !statsBridge.contains("const ESTIMATED_BYTES_PER_BLOCK = 8 * 1024;") ||
                !statsBridge.contains("schemaVersion: 2") ||
                !statsBridge.contains("source: 'midori-privacy-ublock'") ||
                !statsBridge.contains("totalBlocked: blocked") ||
                !statsBridge.contains("totalRequests: blocked + allowed") ||
                !statsBridge.contains("estimatedDataSavedBytes,") ||
                !hasEstimatedCalculation ||
                !statsBridge.contains("dataSavedEstimateModel: 'conservative-8kib-per-block-v1'")) {
            throw new GradleException("Midori Privacy statistics bridge contract is incomplete")
        }

        if (!isMidoriAddonMetadataValid(
                metadata,
                manifest,
                "midori-privacy",
                "https://github.com/goastian/midori-privacy",
                5,
        )) {
            throw new GradleException("Midori Privacy upstream metadata does not match its bundle")
        }

        def bundlePath = midoriPrivacyAssets.toPath()
        def entries = java.nio.file.Files.walk(bundlePath)
        try {
            def unexpectedEntry = entries
                    .filter { path -> path != bundlePath }
                    .filter { path ->
                        !java.nio.file.Files.isDirectory(path, java.nio.file.LinkOption.NOFOLLOW_LINKS) &&
                                !java.nio.file.Files.isRegularFile(path, java.nio.file.LinkOption.NOFOLLOW_LINKS)
                    }
                    .findFirst()
            if (unexpectedEntry.isPresent()) {
                throw new GradleException("Midori Privacy contains a non-regular entry: ${unexpectedEntry.get()}")
            }
        } finally {
            entries.close()
        }

        def sha256 = { byte[] content ->
            java.security.MessageDigest.getInstance("SHA-256")
                    .digest(content)
                    .encodeHex()
                    .toString()
        }
        def bundleRecords = fileTree(midoriPrivacyAssets)
                .matching { exclude("upstream.json") }
                .files
                .sort { first, second ->
                    midoriPrivacyAssets.toPath().relativize(first.toPath()).toString() <=>
                            midoriPrivacyAssets.toPath().relativize(second.toPath()).toString()
                }
                .collect { bundledFile ->
                    def relativePath = midoriPrivacyAssets.toPath()
                            .relativize(bundledFile.toPath())
                            .toString()
                            .replace('\\', '/')
                    "${sha256(bundledFile.bytes)}  ./${relativePath}\n"
                }
                .join("")
        def actualBundleSha256 = sha256(bundleRecords.getBytes(java.nio.charset.StandardCharsets.UTF_8))
        if (actualBundleSha256 != metadata.bundleSha256) {
            throw new GradleException("Midori Privacy bundle checksum does not match upstream.json")
        }
    }
}

