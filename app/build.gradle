tasks.register("verifyLocalizedStrings") {
    group = "verification"
    description = "Checks that every locale declared by locale-config.xml defines every app string."

    doLast {
        def resourcesDirectory = file("src/main/res")
        def stringNamesIn = { File directory ->
            fileTree(directory) {
                include "strings*.xml"
            }.collectMany { resourceFile ->
                new XmlSlurper(false, false)
                    .parse(resourceFile)
                    .children()
                    .findAll { it.@name.text() && it.@translatable.text() != "false" }
                    .collect { it.@name.text() }
            } as Set
        }

        def baseNames = stringNamesIn(resourcesDirectory.toPath().resolve("values").toFile())
        def localeConfig = new XmlSlurper(false, false).parse(file("src/main/res/xml/locales_config.xml"))
        def missingByLocale = localeConfig.locale.collectEntries { locale ->
            def languageTag = locale.attributes().find { key, value -> key.toString().endsWith("name") }?.value?.toString()
            if (languageTag == "en") {
                return [(languageTag): [] as Set]
            }
            def qualifierParts = []
            languageTag.split("-").eachWithIndex { part, index ->
                qualifierParts << (index == 0 ? (part == "id" ? "in" : part) : "r${part}")
            }
            def qualifier = qualifierParts.join("-")
            def localeNames = stringNamesIn(resourcesDirectory.toPath().resolve("values-${qualifier}").toFile())
            [(languageTag): baseNames - localeNames]
        }.findAll { _, missing -> !missing.isEmpty() }

        if (!missingByLocale.isEmpty()) {
            def details = missingByLocale.collect { locale, missing ->
                "${locale}: ${missing.size()} missing (${missing.sort().join(', ')})"
            }.join("\n")
            throw new GradleException("Localized strings are out of sync:\n${details}")
        }
    }
}

tasks.named("check").configure {
    dependsOn(tasks.named("verifyLocalizedStrings"))
}

tasks.register("verifyNativeHome") {
    group = "verification"
    description = "Verifies that the native New Tab screen is packaged without the retired web bundle."
    def homeSource = file("src/main/java/org/midorinext/android/ui/browser/home/NativeHomeScreen.kt")
    inputs.file(homeSource)
    inputs.dir(file("src/main/assets"))
    doLast {
        if (!homeSource.isFile() || !homeSource.getText("UTF-8").contains("fun NativeHomeScreen(")) {
            throw new GradleException("The native New Tab screen is missing")
        }
        if (file("src/main/assets/extensions/midori_newtab").exists()) {
            throw new GradleException("The retired Midori New Tab web bundle must not be packaged")
        }
    }
}

